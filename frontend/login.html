<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <div>

        <h1>

        Tenant System by R.M Technologies
        </h1>
        <h2>Login </h2>
        <label>Email address </label>
        <input type="email" id="email" placeholder="kenya email ea hao">
        <label for="psw">Password </label>
        <input type="password" id="psw" placeholder="kenya sephiri sa hao" name="psw" required>
  
        <p><a href="sign_up.html">You do not have an account yet?</a></p>
        <button onclick="login()">Login</button>

    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('psw').value;

            const res = await fetch('http://localhost:8000/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });

            if (res.ok) {
                window.location.href = 'dashboard.html';
            
            } else {
                alert('Invalid email or password');
            }
        }
    </script>
</body>
</html>
